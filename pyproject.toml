[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arcus-risex-bot"
version = "0.1.0"
description = "Delta-neutral cycle executor for Arcus and RiseX"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "risex==0.10.0",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[project.scripts]
arcus-risex-bot = "arcus_lighter_bot.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
