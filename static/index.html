<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcus / RiseX</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">Delta neutral</p>
      <h1>Arcus + RiseX</h1>
      <p>Maker en Arcus y cobertura automática de cada fill en RiseX.</p>
      <div class="actions"><button id="start-button">Iniciar</button><button id="pause-button">Pausar</button></div>
    </header>
    <section class="card" id="state-card">
      <div class="card-head"><div><p class="eyebrow">Estado del motor</p><h2 id="phase">Cargando</h2></div><span id="mode" class="badge">—</span></div>
      <dl class="metrics">
        <div><dt>Delta neto</dt><dd id="net-delta">—</dd></div>
        <div><dt>Ciclos completados</dt><dd id="cycles">—</dd></div>
        <div><dt>PnL sesión</dt><dd id="pnl">—</dd></div>
        <div><dt>Último error</dt><dd id="error">—</dd></div>
      </dl>
    </section>
    <section class="card"><div class="card-head"><div><p class="eyebrow">Ciclo actual</p><h2 id="cycle-title">Sin ciclo</h2></div></div><pre id="cycle">—</pre></section>
    <section class="card"><div class="card-head"><div><p class="eyebrow">Posiciones</p><h2>Arcus / RiseX</h2></div></div><pre id="positions">—</pre></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
